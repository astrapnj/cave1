<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동굴 탐험 슈팅 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Orbitron', sans-serif;
            background-color: #0d0f18;
            color: #e2e8f0;
            overflow: hidden;
            touch-action: none;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1c29 0%, #090a0f 100%);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
        }
        .glow-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8), 0 0 20px rgba(56, 189, 248, 0.4);
        }
        .glow-box {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center h-screen w-screen select-none">

    <header class="w-full max-w-[800px] flex justify-between items-center px-4 py-2 bg-slate-900/80 border-b border-cyan-500/30 rounded-t-xl z-10">
        <div class="flex items-center space-x-6">
            <div>
                <span class="text-xs text-cyan-400 block">SCORE</span>
                <span id="scoreVal" class="text-xl font-bold tracking-wider text-white">0</span>
            </div>
            <div>
                <span class="text-xs text-cyan-400 block">HIGH SCORE</span>
                <span id="highScoreVal" class="text-xl font-bold tracking-wider text-slate-400">0</span>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div>
                <span class="text-xs text-rose-400 block">HULL (HP)</span>
                <div id="hpBarContainer" class="flex space-x-1 mt-1">
                    <!-- HP hearts/bars injected via js -->
                </div>
            </div>
            <div>
                <span class="text-xs text-yellow-400 block">POWER</span>
                <span id="powerVal" class="text-xl font-bold tracking-wider text-yellow-300">Lv.1</span>
            </div>
        </div>
    </header>

    <main class="relative w-full max-w-[800px] flex-1 flex items-center justify-center bg-black/60 overflow-hidden">
        <canvas id="gameCanvas" class="w-full h-full rounded-b-xl"></canvas>

        <!-- Start Overlay -->
        <div id="startScreen" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center z-20 p-6 text-center">
            <h1 class="text-4xl md:text-6xl font-black text-cyan-400 glow-text mb-4">CAVE RAIDER</h1>
            <p class="text-slate-400 max-w-md mb-8 text-sm md:text-base leading-relaxed">
                어두운 크리스탈 동굴을 탐험하며 적기를 격파하고 장애물(종유석)을 피하세요! 아이템을 먹어 파워업을 하세요.
            </p>
            <div class="bg-slate-900/80 p-4 rounded-xl border border-cyan-500/30 mb-8 text-left text-xs md:text-sm text-slate-300 space-y-2 glow-box">
                <p class="font-bold text-cyan-300 mb-1">🎮 조작 방법</p>
                <p>• <b>이동:</b> 방향키 (←, →, ↑, ↓) 또는 마우스 / 터치 드래그</p>
                <p>• <b>미사일:</b> 자동 발사</p>
            </div>
            <button id="startBtn" class="px-8 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black text-lg rounded-xl transition transform hover:scale-105 shadow-lg shadow-cyan-500/50">
                게임 시작
            </button>
        </div>

        <!-- Game Over Overlay -->
        <div id="gameOverScreen" class="absolute inset-0 bg-slate-950/90 flex flex-col items-center justify-center z-20 p-6 text-center hidden">
            <h2 class="text-4xl md:text-5xl font-black text-rose-500 glow-text mb-2">MISSION FAILED</h2>
            <p class="text-slate-400 mb-6 text-sm">동굴의 위험을 이기지 못하고 기체가 파괴되었습니다.</p>
            <div class="bg-slate-900/80 p-6 rounded-xl border border-rose-500/30 mb-8 w-64 space-y-3 glow-box">
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">최종 점수</span>
                    <span id="finalScore" class="font-bold text-white">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-400">처치한 적</span>
                    <span id="finalKills" class="font-bold text-cyan-400">0</span>
                </div>
            </div>
            <button id="restartBtn" class="px-8 py-3 bg-rose-500 hover:bg-rose-400 text-slate-950 font-black text-lg rounded-xl transition transform hover:scale-105 shadow-lg shadow-rose-500/50">
                다시 도전
            </button>
        </div>
    </main>

    <script>
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Sound Effect: Laser Shoot
        function playLaserSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12);

                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {
                console.error(e);
            }
        }

        // Sound Effect: Explosion
        function playExplosionSound() {
            if (!audioCtx) return;
            try {
                // White noise buffer for explosion rumble
                const bufferSize = audioCtx.sampleRate * 0.3;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = buffer;

                // Filter for low-frequency boom
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(300, audioCtx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

                whiteNoise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                whiteNoise.start();
                whiteNoise.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.error(e);
            }
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreValEl = document.getElementById('scoreVal');
        const highScoreValEl = document.getElementById('highScoreVal');
        const hpBarContainer = document.getElementById('hpBarContainer');
        const powerValEl = document.getElementById('powerVal');
        const finalScoreEl = document.getElementById('finalScore');
        const finalKillsEl = document.getElementById('finalKills');

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = 'START'; 
        let score = 0;
        let highScore = localStorage.getItem('cave_shooter_highscore') || 0;
        highScoreValEl.innerText = highScore;
        let kills = 0;
        let gameTime = 0;

        const keys = {};
        window.addEventListener('keydown', e => { keys[e.code] = true; });
        window.addEventListener('keyup', e => { keys[e.code] = false; });

        let isPointerDown = false;
        let targetX = 0;
        let targetY = 0;

        canvas.addEventListener('pointerdown', e => {
            isPointerDown = true;
            updatePointerPos(e);
        });
        canvas.addEventListener('pointermove', e => {
            if (isPointerDown) updatePointerPos(e);
        });
        canvas.addEventListener('pointerup', () => { isPointerDown = false; });
        canvas.addEventListener('pointercancel', () => { isPointerDown = false; });

        function updatePointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            targetX = e.clientX - rect.left;
            targetY = e.clientY - rect.top;
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 100;
                this.speed = 6;
                this.maxHp = 3;
                this.hp = 3;
                this.power = 1;
                this.invincibleTimer = 0;
                this.shootCooldown = 0;
            }

            reset() {
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 100;
                this.hp = 3;
                this.power = 1;
                this.invincibleTimer = 0;
                this.shootCooldown = 0;
            }

            update() {
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
                if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
                if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;

                if (isPointerDown) {
                    const dx = targetX - (this.x + this.width / 2);
                    const dy = targetY - (this.y + this.height / 2);
                    this.x += dx * 0.15;
                    this.y += dy * 0.15;
                }

                if (this.x < 10) this.x = 10;
                if (this.x > canvas.width - this.width - 10) this.x = canvas.width - this.width - 10;
                if (this.y < 10) this.y = 10;
                if (this.y > canvas.height - this.height - 10) this.y = canvas.height - this.height - 10;

                if (this.invincibleTimer > 0) this.invincibleTimer--;

                if (this.shootCooldown > 0) {
                    this.shootCooldown--;
                } else {
                    this.shoot();
                    this.shootCooldown = 12;
                }
            }

            shoot() {
                playLaserSound();
                if (this.power === 1) {
                    bullets.push(new Bullet(this.x + this.width / 2 - 3, this.y, 0, -12, true));
                } else if (this.power === 2) {
                    bullets.push(new Bullet(this.x + 5, this.y, 0, -12, true));
                    bullets.push(new Bullet(this.x + this.width - 10, this.y, 0, -12, true));
                } else {
                    bullets.push(new Bullet(this.x + this.width / 2 - 3, this.y, 0, -14, true));
                    bullets.push(new Bullet(this.x, this.y + 10, -2, -12, true));
                    bullets.push(new Bullet(this.x + this.width - 6, this.y + 10, 2, -12, true));
                }
            }

            draw() {
                if (this.invincibleTimer > 0 && Math.floor(Date.now() / 50) % 2 === 0) return;

                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                ctx.fillStyle = '#38bdf8';
                ctx.beginPath();
                ctx.arc(0, this.height / 2, 6 + Math.random() * 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0ea5e9';
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(this.width / 4, this.height / 3);
                ctx.lineTo(0, this.height / 2 - 5);
                ctx.lineTo(-this.width / 4, this.height / 3);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#a5f3fc';
                ctx.beginPath();
                ctx.arc(0, -2, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy, isPlayer) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.isPlayer = isPlayer;
                this.width = isPlayer ? 6 : 8;
                this.height = isPlayer ? 14 : 12;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.save();
                if (this.isPlayer) {
                    ctx.fillStyle = '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(this.x, this.y, this.width, this.height);
                } else {
                    ctx.fillStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(this.x + this.width/2, this.y + this.height/2, this.width/2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(type) {
                this.type = type; 
                this.width = type === 'stalactite' ? 50 : 36;
                this.height = type === 'stalactite' ? 60 : 36;
                this.x = Math.random() * (canvas.width - this.width - 60) + 30;
                this.y = -this.height;
                this.vy = type === 'stalactite' ? 2 : (type === 'bat' ? 3.5 : 2.5);
                this.vx = 0;
                this.hp = type === 'drone' ? 2 : 1;
                this.maxHp = this.hp;
                this.shootTimer = Math.random() * 60;
                this.angle = 0;
            }

            update() {
                this.y += this.vy;
                if (this.type === 'bat') {
                    this.angle += 0.05;
                    this.x += Math.sin(this.angle) * 2;
                }

                if (this.type === 'drone') {
                    this.shootTimer++;
                    if (this.shootTimer > 90) {
                        this.shootTimer = 0;
                        bullets.push(new Bullet(this.x + this.width / 2 - 4, this.y + this.height, 0, 5, false));
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);

                if (this.type === 'stalactite') {
                    ctx.fillStyle = '#475569';
                    ctx.strokeStyle = '#94a3b8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                } else if (this.type === 'drone') {
                    ctx.fillStyle = '#64748b';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(0, 0, 6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#7c2d12';
                    ctx.strokeStyle = '#fb923c';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, this.width / 2, this.height / 3, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        class Item {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; 
                this.width = 24;
                this.height = 24;
                this.vy = 1.5;
                this.angle = 0;
            }

            update() {
                this.y += this.vy;
                this.angle += 0.05;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
                ctx.rotate(this.angle);

                if (this.type === 'hp') {
                    ctx.fillStyle = '#f43f5e';
                    ctx.shadowColor = '#f43f5e';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(-8, -8, 16, 16);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('+', 0, 0);
                } else {
                    ctx.fillStyle = '#eab308';
                    ctx.shadowColor = '#eab308';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.arc(0, 0, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 10px Orbitron';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('P', 0, 0);
                }

                ctx.restore();
            }
        }

        class CaveEnvironment {
            constructor() {
                this.crystals = [];
                this.wallsLeft = [];
                this.wallsRight = [];
                this.segmentHeight = 40;
                this.initCave();
            }

            initCave() {
                let leftWidth = 40;
                let rightWidth = 40;
                for (let y = 0; y < canvas.height + 100; y += this.segmentHeight) {
                    this.wallsLeft.push(leftWidth);
                    this.wallsRight.push(rightWidth);
                }

                for (let i = 0; i < 20; i++) {
                    this.crystals.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 2,
                        color: Math.random() > 0.5 ? '#38bdf8' : '#c084fc',
                        alpha: Math.random()
                    });
                }
            }

            update() {
                this.wallsLeft.pop();
                this.wallsRight.pop();

                let lastLeft = this.wallsLeft[0];
                let lastRight = this.wallsRight[0];

                lastLeft += (Math.random() - 0.5) * 10;
                lastRight += (Math.random() - 0.5) * 10;

                if (lastLeft < 20) lastLeft = 20;
                if (lastLeft > 150) lastLeft = 150;
                if (lastRight < 20) lastRight = 20;
                if (lastRight > 150) lastRight = 150;

                this.wallsLeft.unshift(lastLeft);
                this.wallsRight.unshift(lastRight);

                this.crystals.forEach(c => {
                    c.y += 1.5;
                    c.alpha += 0.02;
                    if (c.y > canvas.height) {
                        c.y = 0;
                        c.x = Math.random() * canvas.width;
                    }
                });
            }

            draw() {
                this.crystals.forEach(c => {
                    ctx.save();
                    ctx.fillStyle = c.color;
                    ctx.globalAlpha = Math.abs(Math.sin(c.alpha)) * 0.7 + 0.3;
                    ctx.shadowColor = c.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 3;

                ctx.beginPath();
                ctx.moveTo(0, 0);
                for (let i = 0; i < this.wallsLeft.length; i++) {
                    ctx.lineTo(this.wallsLeft[i], i * this.segmentHeight);
                }
                ctx.lineTo(0, canvas.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(canvas.width, 0);
                for (let i = 0; i < this.wallsRight.length; i++) {
                    ctx.lineTo(canvas.width - this.wallsRight[i], i * this.segmentHeight);
                }
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }
        }

        let player = new Player();
        let bullets = [];
        let enemies = [];
        let items = [];
        let cave = new CaveEnvironment();

        let enemySpawnTimer = 0;

        function resetGame() {
            player.reset();
            bullets = [];
            enemies = [];
            items = [];
            score = 0;
            kills = 0;
            gameTime = 0;
            enemySpawnTimer = 0;
            updateUI();
        }

        function updateUI() {
            scoreValEl.innerText = score;
            highScoreValEl.innerText = highScore;
            powerValEl.innerText = 'Lv.' + player.power;

            hpBarContainer.innerHTML = '';
            for (let i = 0; i < player.maxHp; i++) {
                const heart = document.createElement('div');
                heart.className = `w-4 h-4 rounded-sm ${i < player.hp ? 'bg-rose-500 shadow-md shadow-rose-500/50' : 'bg-slate-700'}`;
                hpBarContainer.appendChild(heart);
            }
        }

        function checkCollisions() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (!b.isPlayer) continue;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (
                        b.x < e.x + e.width &&
                        b.x + b.width > e.x &&
                        b.y < e.y + e.height &&
                        b.y + b.height > e.y
                    ) {
                        bullets.splice(i, 1);
                        e.hp--;
                        if (e.hp <= 0) {
                            playExplosionSound();
                            score += e.type === 'stalactite' ? 50 : 100;
                            kills++;

                            if (Math.random() < 0.25) {
                                const itemType = Math.random() < 0.5 ? 'hp' : 'power';
                                items.push(new Item(e.x + e.width / 2 - 12, e.y + e.height / 2 - 12, itemType));
                            }

                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                if (b.isPlayer) continue;

                if (
                    b.x < player.x + player.width &&
                    b.x + b.width > player.x &&
                    b.y < player.y + player.height &&
                    b.y + b.height > player.y
                ) {
                    bullets.splice(i, 1);
                    hitPlayer();
                    break;
                }
            }

            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y
                ) {
                    playExplosionSound();
                    enemies.splice(j, 1);
                    hitPlayer();
                    break;
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                const it = items[i];
                if (
                    player.x < it.x + it.width &&
                    player.x + player.width > it.x &&
                    player.y < it.y + it.height &&
                    player.y + player.height > it.y
                ) {
                    if (it.type === 'hp') {
                        if (player.hp < player.maxHp) player.hp++;
                    } else if (it.type === 'power') {
                        if (player.power < 3) player.power++;
                    }
                    score += 25;
                    items.splice(i, 1);
                }
            }
        }

        function hitPlayer() {
            if (player.invincibleTimer > 0) return;
            player.hp--;
            player.invincibleTimer = 60;

            if (player.hp <= 0) {
                playExplosionSound();
                triggerGameOver();
            }
        }

        function triggerGameOver() {
            gameState = 'GAMEOVER';
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('cave_shooter_highscore', highScore);
            }
            finalScoreEl.innerText = score;
            finalKillsEl.innerText = kills;
            gameOverScreen.classList.remove('hidden');
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') return;

            gameTime++;

            enemySpawnTimer++;
            if (enemySpawnTimer > Math.max(30, 70 - Math.floor(gameTime / 300))) {
                enemySpawnTimer = 0;
                const rand = Math.random();
                let type = 'drone';
                if (rand < 0.4) type = 'stalactite';
                else if (rand < 0.7) type = 'bat';
                enemies.push(new Enemy(type));
            }

            cave.update();
            player.update();

            bullets.forEach(b => b.update());
            bullets = bullets.filter(b => b.y > -50 && b.y < canvas.height + 50 && b.x > 0 && b.x < canvas.width);

            enemies.forEach(e => e.update());
            enemies = enemies.filter(e => e.y < canvas.height + 100);

            items.forEach(it => it.update());
            items = items.filter(it => it.y < canvas.height + 50);

            checkCollisions();
            updateUI();

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            cave.draw();
            items.forEach(it => it.draw());
            enemies.forEach(e => e.draw());
            bullets.forEach(b => b.draw());
            player.draw();

            requestAnimationFrame(gameLoop);
        }

        startBtn.addEventListener('click', () => {
            initAudio();
            startScreen.classList.add('hidden');
            resetGame();
            gameState = 'PLAYING';
            requestAnimationFrame(gameLoop);
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            gameOverScreen.classList.add('hidden');
            resetGame();
            gameState = 'PLAYING';
            requestAnimationFrame(gameLoop);
        });
    </script>
</body>
</html>
